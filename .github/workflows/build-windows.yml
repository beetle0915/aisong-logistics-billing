name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Force UTF-8 console
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          echo "PYTHONUTF8=$env:PYTHONUTF8" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "PYTHONIOENCODING=$env:PYTHONIOENCODING" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements-windows.txt

      - name: Resolve app version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'app'); from express_app.version import APP_VERSION; print(APP_VERSION)"
          echo "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build executable
        shell: pwsh
        run: |
          cd app
          python -B build_windows_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aisong-freight-manager-v${{ env.APP_VERSION }}-windows
          path: app/dist/windows/艾松运费管家-V${{ env.APP_VERSION }}/
